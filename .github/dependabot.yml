version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ['*'] }
    ignore:
      # svelte-check does not support TypeScript 7 on its own yet (needs TS 6 alongside and --tsgo).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly }
    ignore:
      # Stay on the current Node LTS line; move to the next LTS on purpose, not to odd-numbered or pre-LTS releases.
      - dependency-name: node
        update-types: ['version-update:semver-major']
