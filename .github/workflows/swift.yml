# Tests of the Swift reference engine (VEKit). Tests that need private device files skip.
name: Swift engine

on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'Package.swift', '.github/workflows/swift.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test
